name: Little Days - plan input
on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'Idea ID; leave blank to scan all rows'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: little-days-intake
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Plan live sheet (read only)
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IDEA_ID: ${{ inputs.idea }}
        run: |
          python scripts/actions_plan.py
